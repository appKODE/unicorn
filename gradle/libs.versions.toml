[versions]
koTest = "6.1.9"
ktlint = "1.8.0"
coroutines = "1.10.2"
kotlin = "2.3.20"
turbine = "1.2.1"
spotless = "8.4.0"
vanniktechMavenPublish = "0.37.0"
ksp = "2.3.6"
kover = "0.9.11"

[libraries]
kotest-junit-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "koTest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "koTest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "koTest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "koTest" }
ktlint = { module = "com.pinterest:ktlint", version.ref = "ktlint" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[bundles]
koTestCommon = ["kotest-assertions-core", "kotest-property", "kotest-framework-engine"]
koTestJvm = ["kotest-junit-runner"]
coroutines = ["coroutines-core"]

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
kotest = { id = "io.kotest", version.ref = "koTest" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
